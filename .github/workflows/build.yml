name: Build ESP32 Bit Pirate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build for ESP32-S3 DevKit N16R8
        run: pio run -e s3-devkit-n16-r8

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/s3-devkit-n16-r8/firmware.bin
